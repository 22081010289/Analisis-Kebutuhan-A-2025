<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Swalayan Bagus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        /* Header styles */
        header {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            background-color: white;
        }
        
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo-kategori {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .logo {
            width: 70px;
            height: 70px;
        }
        
        .kategori-dropdown {
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }
        
        .search-bar {
            flex-grow: 1;
            margin: 0 20px;
        }
        
        .search-bar input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 16px;
        }
        
        .user-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .cart-icon, .user-icon {
            font-size: 24px;
            cursor: pointer;
        }
        
        /* Main content styles */
        .main-content {
            padding: 30px 0;
        }
        
        .hero-section {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }
        
        .store-image {
            flex: 1;
            margin-right: 30px;
        }
        
        .store-image img {
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: cover;
        }
        
        .store-info {
            flex: 1;
        }
        
        .welcome-text {
            color: #e74c3c;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .store-name {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        /* Categories section styles */
        .categories-section {
            margin-bottom: 40px;
        }
        
        .categories-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .categories-title {
            font-size: 24px;
            font-weight: bold;
        }
        
        .view-all {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        
        .categories-slider {
            position: relative;
        }
        
        .categories-container {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 15px;
        }
        
        .category-card {
            min-width: 150px;
            border: 1px solid #eee;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .category-image {
            width: 120px;
            height: 120px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .category-image img {
            max-width: 100%;
            max-height: 100%;
        }
        
        .category-name {
            font-size: 16px;
            color: #666;
        }
        
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            z-index: 1;
        }
        
        .left-arrow {
            left: -20px;
        }
        
        .right-arrow {
            right: -20px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo-kategori">
                    <div class="logo">
                        <img src="Logo Toko bagus.png" alt="Logo Bagus" style="width: 100%; height: 100%; object-fit: contain; border-radius: 50%;">
                    </div>
                    <div class="kategori-dropdown">
                        Kategori
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                </div>
                
                <div class="search-bar">
                    <input type="text" placeholder="Saya ingin mencari...">
                </div>
                
                <div class="user-actions">
                    <div class="cart-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                    </div>
                    <div class="user-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </header>
    
    <main class="main-content">
        <div class="container">
            <section class="hero-section">
                <div class="store-image">
                    <img src="toko-swalayan-bagus.webp" alt="Toko Swalayan Bagus" style="width: 100%; height: auto; object-fit: cover;">
                </div>
                <div class="store-info">
                    <div class="welcome-text">SELAMAT DATANG DI</div>
                    <h1 class="store-name">Toko Swalayan Bagus</h1>
                </div>
            </section>
            
            <section class="categories-section">
                <div class="categories-header">
                    <h2 class="categories-title">Kategori Belanja</h2>
                    <a href="#" class="view-all">
                        View All
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </a>
                </div>
                
                <div class="categories-slider">
                    <div class="slider-arrow left-arrow">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </div>
                    
                    <div class="categories-container">
                        <div class="category-card">
                            <div class="category-image">
                                <!-- Tidak ada gambar sesuai permintaan -->
                            </div>
                            <div class="category-name">Makanan</div>
                        </div>
                        
                        <div class="category-card">
                            <div class="category-image">
                                <!-- Tidak ada gambar sesuai permintaan -->
                            </div>
                            <div class="category-name">Dapur & Bahan</div>
                        </div>
                        
                        <div class="category-card">
                            <div class="category-image">
                                <!-- Tidak ada gambar sesuai permintaan -->
                            </div>
                            <div class="category-name">Minuman</div>
                        </div>
                        
                        <div class="category-card">
                            <div class="category-image">
                                <!-- Tidak ada gambar sesuai permintaan -->
                            </div>
                            <div class="category-name">Ibu & Anak</div>
                        </div>
                        
                        <div class="category-card">
                            <div class="category-image">
                                <!-- Tidak ada gambar sesuai permintaan -->
                            </div>
                            <div class="category-name">Kesehatan & Kebersihan</div>
                        </div>
                    </div>
                    
                    <div class="slider-arrow right-arrow">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
